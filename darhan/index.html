      + (D.instagram ? '<a class="btn btn-ghost" href="https://instagram.com/' + esc(D.instagram) + '" target="_blank" rel="noopener">' + t('insta') + '</a>' : '')
      + '</div></div></div></section></main>';

    h += '<footer><div class="wrap"><span>' + esc(name) + ', ' + esc(L(D.address)) + '</span>'
      + (D.demo ? '<span>' + esc(t('made', { by: by })) + (D.demo.contact ? '. <a href="' + esc(D.demo.contact) + '" target="_blank" rel="noopener">' + t('made_cta') + '</a>' : '') + '</span>' : '')
      + '</div></footer>';

    h += '<div class="dock"><a class="btn btn-ghost" href="tel:' + D.phone + '">' + icon.phone + t('call') + '</a>'
      + '<a class="btn btn-main" href="' + wa(t('wa_order')) + '" target="_blank" rel="noopener">' + icon.wa + 'WhatsApp</a></div>';

    document.getElementById('app').innerHTML = h;
    document.querySelectorAll('.lang button').forEach(function (b) {
      b.addEventListener('click', function () {
        lang = b.getAttribute('data-lang');
        try { localStorage.setItem('lang', lang); } catch (e) {}
        render();
      });
    });
  }

  function langSwitch() {
    return '<div class="lang" role="group" aria-label="Язык / Тил">'
      + '<button type="button" data-lang="ru" aria-pressed="' + (lang === 'ru') + '">RU</button>'
      + '<button type="button" data-lang="ky" aria-pressed="' + (lang === 'ky') + '">KG</button></div>';
  }

  render();
})();
</script>
</body>
</html>
