      hall: 'Банкеттер жана майрамдар', hall_lead: 'Үй-бүлө, достор жана кесиптештер үчүн өзүнчө залдар жана кабиналар.',
      book: 'Стол брондоо',
      find: 'Кантип жетүү', addr: 'Дарек', hours: 'Иш убактысы', pay: 'Төлөм',
      open_gis: '2ГИСте жол', insta: 'Instagram',
      made: 'Сайтты даярдаган: {by}', made_cta: 'Мага да ушундай сайт керек', photo: 'Демодогу сүрөттөр: Unsplash',
      wa_order: 'Саламатсызбы! Буйрутма бергим келет: ',
      wa_dish: 'Саламатсызбы! Буйрутма бергим келет: {dish}',
      wa_book: 'Саламатсызбы! Стол брондогум келет. Күнү, убактысы жана коноктордун саны: '
    }
  };

  var lang = 'ru', cat = 0;
  try { var saved = localStorage.getItem('lang'); if (saved === 'ky' || saved === 'ru') lang = saved; } catch (e) {}

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function t(key, vars) {
    var s = UI[lang][key];
    if (vars) for (var k in vars) s = s.replace('{' + k + '}', vars[k]);
    return s;
  }
  function L(obj) { return obj[lang] || obj.ru; }
  function wa(text) { return 'https://wa.me/' + D.whatsapp + '?text=' + encodeURIComponent(text); }
  function price(n) { return n.toLocaleString('ru-RU').replace(/ /g, ' '); }
  function photo(id, w) { return 'https://images.unsplash.com/photo-' + id + '?auto=format&fit=crop&q=70&w=' + w; }
  function srcset(id, ws) { return ws.map(function (w) { return photo(id, w) + ' ' + w + 'w'; }).join(', '); }

  var icon = {
    wa: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.3-.4.8-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 2s.8 2.3.9 2.5c.1.2 1.6 2.5 4 3.5 1.5.6 2 .7 2.8.6.4-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.1-.1Z"/></svg>',
    phone: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M5 3h3.5l1.7 4.4-2.2 1.4a11 11 0 0 0 5.2 5.2l1.4-2.2L19 13.5V17a2 2 0 0 1-2.2 2A15 15 0 0 1 3 5.2 2 2 0 0 1 5 3Z"/></svg>'
  };

  // Лента сюзане: розетки из шафрановых лепестков с красной серединой, между ними ромбы
  function band() {
    function c(hex) { return hex.replace('#', '%23'); }
    var p = '';
    for (var i = 0; i < 8; i++) p += '<ellipse cx="34" cy="8.5" rx="3.6" ry="7" fill="' + c(T.saffron) + '" transform="rotate(' + (i * 45) + ' 34 17)"/>';
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="68" height="34" viewBox="0 0 68 34">'
      + p + '<circle cx="34" cy="17" r="5.5" fill="' + c(T.suzani) + '"/><circle cx="34" cy="17" r="2" fill="' + c(T.milk) + '"/>'
      + '<path d="M0 11l6 6-6 6M68 11l-6 6 6 6" fill="' + c(T.suzani) + '"/>'
      + '<circle cx="12" cy="17" r="1.8" fill="' + c(T.saffron2) + '"/><circle cx="56" cy="17" r="1.8" fill="' + c(T.saffron2) + '"/></svg>';
    return 'url("data:image/svg+xml;utf8,' + svg.replace(/"/g, "'").replace(/</g, '%3C').replace(/>/g, '%3E') + '")';
  }

  function render() {
    document.documentElement.lang = lang === 'ky' ? 'ky' : 'ru';
    var name = L(D.name);
    var by = D.demo ? L(D.demo.by) : '';
    var h = '';

    if (D.demo) {
      h += '<div class="demo"><div class="wrap"><span>' + esc(t('demo', { name: name, by: by })) + '</span>' + langSwitch() + '</div></div>';
    }

    // первый экран
    h += '<header class="hero">'
      + (D.heroImg ? '<div class="hero-img"><img src="' + photo(D.heroImg, 1200) + '" srcset="' + srcset(D.heroImg, [800, 1200, 1800]) + '" sizes="100vw" alt="" fetchpriority="high"></div>' : '')
      + '<div class="wrap hero-top"><a class="logo" href="#">' + esc(name) + '</a>'
      + '<nav class="links"><a href="#food">' + t('nav_food') + '</a><a href="#hall">' + t('nav_hall') + '</a><a href="#find">' + t('nav_find') + '</a></nav>'
      + (D.demo ? '' : langSwitch()) + '</div>'
      + '<div class="wrap"><div class="hero-body">'
      + '<p class="kind">' + esc(L(D.kind)) + '</p>'
      // длинное название уменьшаем, чтобы оно помещалось на экране телефона
      + '<h1' + (name.length > 7 ? ' style="font-size: clamp(44px, calc((100vw - 32px) / ' + (name.length * 0.64).toFixed(2) + '), 148px)"' : '') + '>' + esc(name) + '</h1>'
      + '<p class="tagline">' + esc(L(D.tagline)) + '</p>'
      + (D.rating ? '<p class="rating"><span class="stars" aria-hidden="true">★★★★★</span><span>' + t('rating', { v: esc(D.rating.value), n: D.rating.count }) + '</span></p>' : '')
      + '<div class="actions">'
      + '<a class="btn btn-gold" href="' + wa(t('wa_order')) + '" target="_blank" rel="noopener">' + icon.wa + t('order') + '</a>'
      + '<a class="btn btn-line" href="tel:' + D.phone + '">' + icon.phone + t('call') + '</a>'
      + '</div>'
      + '<ul class="facts"><li>' + esc(L(D.hours)) + '</li>' + (D.facts || []).map(function (x) { return '<li>' + esc(L(x)) + '</li>'; }).join('') + '</ul>'
      + '</div></div></header>';

    h += '<div class="band" aria-hidden="true"></div>';

    // блюда и меню
    h += '<main><section class="block" id="food"><div class="wrap">'
      + '<h2>' + t('food') + '</h2><p class="lead">' + t('food_lead') + '</p>'
      + '<div class="hits">';
    (D.hits || []).forEach(function (it) {
      var dish = L(it);
      h += '<article class="dish"><div class="dish-img"><img src="' + photo(it.img, 600) + '" srcset="' + srcset(it.img, [400, 600, 900]) + '" sizes="(min-width: 880px) 25vw, 78vw" alt="' + esc(dish) + '" loading="lazy"></div>'
        + '<h3>' + esc(dish) + '</h3><p>' + esc(L(it.desc)) + '</p>'
        + '<div class="dish-foot"><span class="dish-price">' + price(it.price) + ' <small>' + t('som') + '</small></span>'
        + '<a class="btn btn-red" href="' + wa(t('wa_dish', { dish: dish })) + '" target="_blank" rel="noopener">' + t('order_one') + '</a></div></article>';
    });
    h += '</div>';

    h += '<div class="menu-box"><h2>' + t('menu') + '</h2>'
      + '<div class="tabs" role="group" aria-label="' + t('menu') + '">'
      + D.menu.map(function (g, i) { return '<button type="button" data-cat="' + i + '" aria-pressed="' + (i === cat) + '">' + esc(L(g.cat)) + '</button>'; }).join('')
      + '</div><ul class="menu-list">'
      + D.menu[cat].items.map(function (it) {
          return '<li><span class="name">' + esc(L(it)) + '</span><span class="gap"></span><span class="price">' + price(it.price) + ' <small>' + t('som') + '</small></span></li>';
        }).join('')
      + '</ul>'
      + (D.demo ? '<p class="note">' + (D.demoNote ? esc(L(D.demoNote)) : t('demo_note')) + '</p>' : '')
      + '</div></div></section>';

    // банкеты
    h += '<section class="block dark" id="hall"><div class="wrap hall">'
      + (D.hallImg ? '<div class="hall-img"><img src="' + photo(D.hallImg, 900) + '" srcset="' + srcset(D.hallImg, [600, 900, 1400]) + '" sizes="(min-width: 880px) 50vw, 100vw" alt="" loading="lazy"></div>' : '')
      + '<div><h2>' + t('hall') + '</h2><p class="lead">' + (D.hallLead ? esc(L(D.hallLead)) : t('hall_lead')) + '</p>'
      + '<ul class="features">' + D.hall.map(function (x) { return '<li>' + esc(L(x)) + '</li>'; }).join('') + '</ul>'
      + '<ul class="events">' + D.events.map(function (x) { return '<li>' + esc(L(x)) + '</li>'; }).join('') + '</ul>'
      + '<a class="btn btn-gold" href="' + wa(t('wa_book')) + '" target="_blank" rel="noopener">' + icon.wa + t('book') + '</a>'
      + '</div></div></section>';

    // как добраться
    var g = D.geo, d = 0.004;
    h += '<section class="block" id="find"><div class="wrap"><h2>' + t('find') + '</h2>'
      + '<div class="find"><div><dl>'
      + '<div><dt>' + t('addr') + '</dt><dd>' + esc(L(D.address)) + (D.landmark ? '<small>' + esc(L(D.landmark)) + '</small>' : '') + '</dd></div>'
      + '<div><dt>' + t('hours') + '</dt><dd>' + esc(L(D.hours)) + '</dd></div>'
      + '<div><dt>' + t('pay') + '</dt><dd>' + esc(L(D.payment)) + '</dd></div>'
      + '</dl><div class="actions">'
      + '<a class="btn btn-red" href="' + esc(D.gis) + '" target="_blank" rel="noopener">' + t('open_gis') + '</a>'
      + '<a class="btn btn-dark" href="tel:' + D.phone + '">' + icon.phone + esc(D.phoneLabel) + '</a>'
      + (D.instagram ? '<a class="btn btn-dark" href="https://instagram.com/' + esc(D.instagram) + '" target="_blank" rel="noopener">' + t('insta') + '</a>' : '')
      + '</div></div>'
      + (g ? '<div class="map"><iframe title="' + t('find') + '" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox='
          + (g.lon - d) + '%2C' + (g.lat - d * .7) + '%2C' + (g.lon + d) + '%2C' + (g.lat + d * .7)
          + '&layer=mapnik&marker=' + g.lat + '%2C' + g.lon + '"></iframe></div>' : '')
      + '</div></div></section></main>';

    h += '<footer><div class="wrap"><span>' + esc(name) + ', ' + esc(L(D.address)) + '</span>'
      + (D.demo ? '<span>' + esc(t('made', { by: by })) + (D.demo.contact ? '. <a href="' + esc(D.demo.contact) + '" target="_blank" rel="noopener">' + t('made_cta') + '</a>' : '') + '</span><span>' + t('photo') + '</span>' : '')
      + '</div></footer>';

    h += '<div class="dock"><a class="btn btn-line" href="tel:' + D.phone + '">' + icon.phone + t('call') + '</a>'
      + '<a class="btn btn-gold" href="' + wa(t('wa_order')) + '" target="_blank" rel="noopener">' + icon.wa + 'WhatsApp</a></div>';

    var y = window.scrollY;
    document.getElementById('app').innerHTML = h;
    window.scrollTo(0, y);
    bind();
  }

  function bind() {
    document.querySelectorAll('.band').forEach(function (el) { el.style.backgroundImage = band(); });
    document.querySelectorAll('.lang button').forEach(function (b) {
      b.addEventListener('click', function () {
        lang = b.getAttribute('data-lang');
        try { localStorage.setItem('lang', lang); } catch (e) {}
        render();
      });
    });
    document.querySelectorAll('.tabs button').forEach(function (b) {
      b.addEventListener('click', function () { cat = +b.getAttribute('data-cat'); render(); });
    });
    // панель с кнопками появляется, когда кнопки первого экрана ушли из вида
    var dock = document.querySelector('.dock'), acts = document.querySelector('.hero .actions');
    if (dock && acts && 'IntersectionObserver' in window) {
      new IntersectionObserver(function (e) { dock.classList.toggle('on', !e[0].isIntersecting); }).observe(acts);
    } else if (dock) dock.classList.add('on');
  }

  function langSwitch() {
    return '<div class="lang" role="group" aria-label="Язык / Тил">'
      + '<button type="button" data-lang="ru" aria-pressed="' + (lang === 'ru') + '">RU</button>'
      + '<button type="button" data-lang="ky" aria-pressed="' + (lang === 'ky') + '">KG</button></div>';
  }

  render();
})();
</script>
</body>
</html>
